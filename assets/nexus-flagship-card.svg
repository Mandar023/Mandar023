<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="300">
  <defs>
    <linearGradient id="flag-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060914" />
      <stop offset="50%" stop-color="#0a1226" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <linearGradient id="neon-stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="card-title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="f-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseFlag {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; filter: drop-shadow(0 0 8px #00f2fe); }
    }
    @keyframes sweepLaser {
      0% { transform: translateX(0); }
      100% { transform: translateX(1000px); }
    }
    .flag-pulse { animation: pulseFlag 3s ease-in-out infinite; }
    .laser-sweep { animation: sweepLaser 6s linear infinite; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="996" height="296" rx="20" fill="url(#flag-bg)" stroke="#1e293b" stroke-width="1.5" />
  <rect x="2" y="2" width="996" height="296" rx="20" fill="none" stroke="url(#neon-stroke)" stroke-width="1.5" />

  <!-- Subtle Top Accent Line -->
  <line x1="60" y1="2" x2="940" y2="2" stroke="#00f2fe" stroke-width="2" filter="url(#f-glow)" />

  <!-- Main Left Content -->
  <g transform="translate(48, 38)">
    <!-- Badges Row -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="136" height="26" rx="6" fill="#0284c7" />
      <text x="12" y="17" fill="#ffffff" font-family="'Fira Code', monospace" font-size="10.5" font-weight="800" letter-spacing="1">FLAGSHIP SUITE</text>

      <rect x="146" y="0" width="70" height="26" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <text x="157" y="17" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="10.5" font-weight="700">v5.5.0</text>

      <rect x="226" y="0" width="168" height="26" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1" />
      <circle cx="238" cy="13" r="4" fill="#34d399" />
      <text x="248" y="17" fill="#6ee7b7" font-family="'Fira Code', monospace" font-size="10" font-weight="700">PRODUCTION VERIFIED</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="70" fill="url(#card-title-grad)" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">
      NEXUS ENTERPRISE STUDIO
    </text>

    <!-- Subtitle / Mission -->
    <text x="0" y="98" fill="#94a3b8" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="14.5" font-weight="500">
      Zero-dependency enterprise desktop suite engineered for enterprise data consolidation, high-speed UNC sync,
    </text>
    <text x="0" y="120" fill="#94a3b8" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="14.5" font-weight="500">
      native Beyond Compare 5 code/folder diffing, and infinite-timeout SSMS-grade SQL infrastructure.
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 142)">
      <rect x="0" y="0" width="158" height="28" rx="6" fill="#0b1329" stroke="#1e3a5f" stroke-width="1" />
      <text x="12" y="18" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="10" font-weight="600">â— Multi-Server Sync</text>

      <rect x="168" y="0" width="168" height="28" rx="6" fill="#0b1329" stroke="#1e3a5f" stroke-width="1" />
      <text x="180" y="18" fill="#a78bfa" font-family="'Fira Code', monospace" font-size="10" font-weight="600">â— Beyond Compare 5</text>

      <rect x="346" y="0" width="154" height="28" rx="6" fill="#0b1329" stroke="#1e3a5f" stroke-width="1" />
      <text x="358" y="18" fill="#2dd4bf" font-family="'Fira Code', monospace" font-size="10" font-weight="600">â— SSMS SQL Console</text>

      <rect x="510" y="0" width="168" height="28" rx="6" fill="#0b1329" stroke="#1e3a5f" stroke-width="1" />
      <text x="522" y="18" fill="#fbbf24" font-family="'Fira Code', monospace" font-size="10" font-weight="600">â— Vector WMF &lt;= 25KB</text>
    </g>

    <!-- Metrics Row -->
    <g transform="translate(0, 192)">
      <g transform="translate(0, 0)">
        <text x="0" y="14" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="18" font-weight="800">0 sec</text>
        <text x="0" y="28" fill="#64748b" font-family="'Fira Code', monospace" font-size="9" font-weight="600">SQL TIMEOUT</text>
      </g>
      <g transform="translate(130, 0)">
        <text x="0" y="14" fill="#10b981" font-family="'Fira Code', monospace" font-size="18" font-weight="800">O(1)</text>
        <text x="0" y="28" fill="#64748b" font-family="'Fira Code', monospace" font-size="9" font-weight="600">DEDUPLICATION</text>
      </g>
      <g transform="translate(260, 0)">
        <text x="0" y="14" fill="#a855f7" font-family="'Fira Code', monospace" font-size="18" font-weight="800">300 DPI</text>
        <text x="0" y="28" fill="#64748b" font-family="'Fira Code', monospace" font-size="9" font-weight="600">OFFLINE AI EXAM</text>
      </g>
      <g transform="translate(410, 0)">
        <text x="0" y="14" fill="#f59e0b" font-family="'Fira Code', monospace" font-size="18" font-weight="800">112 MB/s</text>
        <text x="0" y="28" fill="#64748b" font-family="'Fira Code', monospace" font-size="9" font-weight="600">LAN P2P MESH</text>
      </g>
    </g>
  </g>

  <!-- Right Side Interactive 3D Emblem Frame -->
  <g transform="translate(760, 48)" class="flag-pulse">
    <!-- Outer Glow Ring -->
    <circle cx="100" cy="100" r="88" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.4" />
    <circle cx="100" cy="100" r="72" fill="#071126" stroke="#00f2fe" stroke-width="2" filter="url(#f-glow)" />

    <!-- 3D Monolithic Hexagon Core -->
    <polygon points="100,50 142,75 142,125 100,150 58,125 58,75" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
    <!-- Inner faceted highlights -->
    <polygon points="100,50 142,75 100,100 58,75" fill="#38bdf8" opacity="0.8" />
    <polygon points="58,75 100,100 100,150 58,125" fill="#0369a1" />
    <polygon points="100,100 142,75 142,125 100,150" fill="#0284c7" />

    <text x="100" y="105" text-anchor="middle" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="900">v5.5</text>

    <!-- Orbiting Satellite Indicator -->
    <circle cx="170" cy="65" r="5" fill="#10b981" filter="url(#f-glow)" />
    <circle cx="30" cy="135" r="4" fill="#a855f7" filter="url(#f-glow)" />
  </g>
</svg>
