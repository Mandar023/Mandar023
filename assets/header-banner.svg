<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070f" />
      <stop offset="50%" stop-color="#0a1024" />
      <stop offset="100%" stop-color="#04060c" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyan-glow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="25%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f1f5f9" />
      <stop offset="75%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="cube-face-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cube-face-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="cube-face-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow-bright" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse-ring {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.6; }
      50% { transform: scale(1.08) rotate(180deg); opacity: 0.9; }
    }
    @keyframes scan-laser {
      0% { transform: translateY(0); opacity: 0.2; }
      50% { transform: translateY(276px); opacity: 0.8; }
      100% { transform: translateY(0); opacity: 0.2; }
    }
    @keyframes float-cube {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }
    @keyframes orbit-ring {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes blink-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }
    .laser-line { animation: scan-laser 6s ease-in-out infinite; }
    .cube-group { animation: float-cube 5s ease-in-out infinite; transform-origin: 840px 140px; }
    .orbit-1 { animation: orbit-ring 14s linear infinite; transform-origin: 840px 140px; }
    .orbit-2 { animation: orbit-ring 22s linear infinite reverse; transform-origin: 840px 140px; }
    .live-dot { animation: blink-dot 2s ease-in-out infinite; transform-origin: center; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="996" height="276" rx="20" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ambient Perspective Tech Grid -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="200" x2="1000" y2="200" />
    <line x1="0" y1="230" x2="1000" y2="230" />
    <line x1="0" y1="255" x2="1000" y2="255" />
    <line x1="0" y1="272" x2="1000" y2="272" />
    <!-- Perspective lines converging to center top -->
    <line x1="500" y1="120" x2="0" y2="280" />
    <line x1="500" y1="120" x2="150" y2="280" />
    <line x1="500" y1="120" x2="300" y2="280" />
    <line x1="500" y1="120" x2="450" y2="280" />
    <line x1="500" y1="120" x2="550" y2="280" />
    <line x1="500" y1="120" x2="700" y2="280" />
    <line x1="500" y1="120" x2="850" y2="280" />
    <line x1="500" y1="120" x2="1000" y2="280" />
  </g>

  <!-- Laser Sweep Line -->
  <line x1="2" y1="2" x2="998" y2="2" stroke="url(#cyan-glow-line)" stroke-width="2" class="laser-line" filter="url(#glow-bright)" />

  <!-- Top Accent Border -->
  <line x1="80" y1="2" x2="920" y2="2" stroke="url(#cyan-glow-line)" stroke-width="2.5" filter="url(#glow-bright)" />

  <!-- LEFT CONTENT AREA -->
  <g transform="translate(60, 48)">
    <!-- Status Badge -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#0c162d" stroke="#1e3a5f" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#10b981" class="live-dot" filter="url(#subtle-blur)" />
    <text x="30" y="18" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="10.5" font-weight="700" letter-spacing="1.5">SYSTEMS ARCHITECT // v5.5</text>

    <!-- Main Name Title -->
    <text x="0" y="78" fill="url(#title-grad)" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">MANDAR K.</text>

    <!-- Subtitle -->
    <text x="0" y="112" fill="#e2e8f0" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="16" font-weight="700" letter-spacing="0.5">
      Principal Enterprise Systems &amp; Desktop Infrastructure Engineer
    </text>

    <!-- Tech Competencies -->
    <g transform="translate(0, 138)">
      <rect x="0" y="0" width="132" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="10" y="16" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="10" font-weight="600">PowerShell Core</text>

      <rect x="142" y="0" width="112" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="152" y="16" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="10" font-weight="600">C# / WPF XAML</text>

      <rect x="264" y="0" width="128" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="274" y="16" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="10" font-weight="600">MSSQL Stored Procs</text>

      <rect x="402" y="0" width="128" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="412" y="16" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="10" font-weight="600">Beyond Compare 5</text>

      <rect x="540" y="0" width="128" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="550" y="16" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="10" font-weight="600">Vector WMF &lt;25KB</text>
    </g>

    <text x="0" y="188" fill="#64748b" font-family="'Fira Code', monospace" font-size="11" font-weight="500">
      Zero-Dependency Architectures • Distributed UNC Synchronization • Native Win32 Performance
    </text>
  </g>

  <!-- RIGHT 3D ISOMETRIC HOLOGRAPHIC ELEMENT -->
  <g class="orbit-1">
    <ellipse cx="840" cy="140" rx="90" ry="34" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.6" filter="url(#subtle-blur)" />
  </g>
  <g class="orbit-2">
    <ellipse cx="840" cy="140" rx="90" ry="34" fill="none" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="8,6" opacity="0.5" filter="url(#subtle-blur)" />
  </g>

  <!-- 3D Isometric Crystal Cube Structure -->
  <g class="cube-group">
    <!-- Top Face -->
    <polygon points="840,78 895,110 840,142 785,110" fill="url(#cube-face-top)" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Left Face -->
    <polygon points="785,110 840,142 840,205 785,173" fill="url(#cube-face-left)" stroke="#0284c7" stroke-width="1.5" />
    <!-- Right Face -->
    <polygon points="840,142 895,110 895,173 840,205" fill="url(#cube-face-right)" stroke="#0369a1" stroke-width="1.5" />

    <!-- Inner Glowing Core -->
    <circle cx="840" cy="142" r="10" fill="#00f2fe" filter="url(#glow-bright)" />

    <!-- Corner Neon Pings -->
    <circle cx="840" cy="78" r="3" fill="#ffffff" />
    <circle cx="895" cy="110" r="3" fill="#ffffff" />
    <circle cx="785" cy="110" r="3" fill="#ffffff" />
    <circle cx="840" cy="205" r="3" fill="#38bdf8" />
  </g>
</svg>