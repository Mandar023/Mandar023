<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="100%" height="280">
  <defs>
    <linearGradient id="diff-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>
    <linearGradient id="laser-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="1" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>
    <filter id="laser-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes sweepH {
      0% { transform: translateX(20px); opacity: 0.4; }
      50% { transform: translateX(430px); opacity: 1; }
      100% { transform: translateX(20px); opacity: 0.4; }
    }
    @keyframes diffBlink {
      0%, 100% { fill-opacity: 0.2; }
      50% { fill-opacity: 0.55; }
    }
    .sweep-bar { animation: sweepH 4s ease-in-out infinite; }
    .added-line { animation: diffBlink 2.5s ease-in-out infinite; }
    .removed-line { animation: diffBlink 2.5s ease-in-out infinite 1.25s; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="476" height="276" rx="16" fill="url(#diff-bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="2" y="2" width="476" height="36" rx="16" fill="#0b1329" />
  <rect x="2" y="26" width="476" height="12" fill="#0b1329" />
  <circle cx="20" cy="18" r="4.5" fill="#ef4444" />
  <circle cx="34" cy="18" r="4.5" fill="#f59e0b" />
  <circle cx="48" cy="18" r="4.5" fill="#10b981" />
  <text x="70" y="22" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="11" font-weight="600">02 // BEYOND COMPARE 5 STUDIO</text>
  <rect x="360" y="9" width="104" height="18" rx="9" fill="#1e1b4b" />
  <text x="372" y="22" fill="#a78bfa" font-family="'Fira Code', monospace" font-size="9" font-weight="700">● MYERS DIFF</text>

  <!-- File Tab Bar -->
  <g transform="translate(10, 42)">
    <rect x="0" y="0" width="225" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="10" y="15" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="9.5" font-weight="600">LEFT: TaxConfig_v5.4.ps1</text>
    <rect x="235" y="0" width="225" height="22" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="245" y="15" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="9.5" font-weight="600">RIGHT: TaxConfig_v5.5.ps1</text>
  </g>

  <!-- Split Code Panes -->
  <!-- Left Pane (Original) -->
  <g transform="translate(10, 70)">
    <rect x="0" y="0" width="225" height="160" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1" />
    <!-- Gutter lines -->
    <rect x="0" y="0" width="24" height="160" rx="6" fill="#0b1120" />
    <text x="6" y="22" fill="#475569" font-family="'Fira Code', monospace" font-size="9">10</text>
    <text x="6" y="44" fill="#475569" font-family="'Fira Code', monospace" font-size="9">11</text>
    <text x="6" y="66" fill="#475569" font-family="'Fira Code', monospace" font-size="9">12</text>
    <text x="6" y="88" fill="#475569" font-family="'Fira Code', monospace" font-size="9">13</text>
    <text x="6" y="110" fill="#475569" font-family="'Fira Code', monospace" font-size="9">14</text>
    <text x="6" y="132" fill="#475569" font-family="'Fira Code', monospace" font-size="9">15</text>

    <!-- Code Lines -->
    <text x="32" y="22" fill="#cbd5e1" font-family="'Fira Code', monospace" font-size="9.5">$Timeout = 30</text>
    
    <!-- Red deleted highlight -->
    <rect x="24" y="32" width="200" height="18" fill="#ef4444" class="removed-line" />
    <text x="32" y="44" fill="#fca5a5" font-family="'Fira Code', monospace" font-size="9.5">- $MaxRetries = 3</text>
    
    <text x="32" y="66" fill="#cbd5e1" font-family="'Fira Code', monospace" font-size="9.5">$Path = "\\192.168.1.11"</text>
    <text x="32" y="88" fill="#cbd5e1" font-family="'Fira Code', monospace" font-size="9.5">Invoke-Consolidate</text>
    <text x="32" y="110" fill="#cbd5e1" font-family="'Fira Code', monospace" font-size="9.5">Write-Host "Done"</text>
  </g>

  <!-- Right Pane (New) -->
  <g transform="translate(245, 70)">
    <rect x="0" y="0" width="225" height="160" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1" />
    <!-- Gutter lines -->
    <rect x="0" y="0" width="24" height="160" rx="6" fill="#0b1120" />
    <text x="6" y="22" fill="#475569" font-family="'Fira Code', monospace" font-size="9">10</text>
    <text x="6" y="44" fill="#475569" font-family="'Fira Code', monospace" font-size="9">11</text>
    <text x="6" y="66" fill="#475569" font-family="'Fira Code', monospace" font-size="9">12</text>
    <text x="6" y="88" fill="#475569" font-family="'Fira Code', monospace" font-size="9">13</text>
    <text x="6" y="110" fill="#475569" font-family="'Fira Code', monospace" font-size="9">14</text>
    <text x="6" y="132" fill="#475569" font-family="'Fira Code', monospace" font-size="9">15</text>

    <!-- Code Lines -->
    <text x="32" y="22" fill="#cbd5e1" font-family="'Fira Code', monospace" font-size="9.5">$Timeout = 0 # Infinite</text>
    
    <!-- Green added highlight -->
    <rect x="24" y="32" width="200" height="18" fill="#10b981" class="added-line" />
    <text x="32" y="44" fill="#6ee7b7" font-family="'Fira Code', monospace" font-size="9.5">+ $O1HashFilter = $true</text>
    
    <text x="32" y="66" fill="#cbd5e1" font-family="'Fira Code', monospace" font-size="9.5">$Path = "\\192.168.1.19"</text>
    <text x="32" y="88" fill="#cbd5e1" font-family="'Fira Code', monospace" font-size="9.5">Invoke-ConsolidateFast</text>
    <text x="32" y="110" fill="#cbd5e1" font-family="'Fira Code', monospace" font-size="9.5">Write-Host "Zero Bugs"</text>
  </g>

  <!-- Glowing Laser Sweep Bar across both panes -->
  <g class="sweep-bar">
    <rect x="0" y="70" width="3" height="160" fill="#00f2fe" filter="url(#laser-glow)" />
    <line x1="0" y1="70" x2="0" y2="230" stroke="#ffffff" stroke-width="1.5" />
  </g>

  <!-- Status Bottom Banner -->
  <g transform="translate(10, 238)">
    <rect x="0" y="0" width="460" height="30" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="12" y="19" fill="#10b981" font-family="'Fira Code', monospace" font-size="10" font-weight="700">✓ CRC32 MATCH (100% IDENTICAL)</text>
    <text x="310" y="19" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="9.5">Myers &amp; Patience Diff</text>
  </g>
</svg>