<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="100%" height="280">
  <defs>
    <linearGradient id="wmf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>
    <filter id="wmf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="left-clip">
      <rect x="10" y="44" width="225" height="186" rx="6" />
    </clipPath>
    <clipPath id="right-clip">
      <rect x="245" y="44" width="225" height="186" rx="6" />
    </clipPath>
  </defs>

  <style>
    @keyframes sliderMove {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(10px); }
    }
    @keyframes vectorPulse {
      0%, 100% { stroke: #0284c7; }
      50% { stroke: #00f2fe; }
    }
    .slider-handle { animation: sliderMove 4s ease-in-out infinite; }
    .cad-line { animation: vectorPulse 3s ease-in-out infinite; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="476" height="276" rx="16" fill="url(#wmf-bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="2" y="2" width="476" height="36" rx="16" fill="#0b1329" />
  <rect x="2" y="26" width="476" height="12" fill="#0b1329" />
  <circle cx="20" cy="18" r="4.5" fill="#ef4444" />
  <circle cx="34" cy="18" r="4.5" fill="#f59e0b" />
  <circle cx="48" cy="18" r="4.5" fill="#10b981" />
  <text x="70" y="22" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="11" font-weight="600">04 // VECTOR WMF / EMF OPTIMIZER</text>
  <rect x="360" y="9" width="104" height="18" rx="9" fill="#312e81" />
  <text x="372" y="22" fill="#818cf8" font-family="'Fira Code', monospace" font-size="9" font-weight="700">● 99.5% SHRUNK</text>

  <!-- LEFT PANE: RAW CAD (4.8 MB) RASTER BLUR -->
  <g transform="translate(10, 44)">
    <rect x="0" y="0" width="225" height="186" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
    <!-- Distorted raster plan layout -->
    <g opacity="0.45" stroke="#ef4444" stroke-width="3" stroke-linecap="round">
      <rect x="30" y="30" width="165" height="120" fill="none" stroke-dasharray="4,4" />
      <line x1="30" y1="70" x2="195" y2="70" />
      <line x1="100" y1="30" x2="100" y2="150" />
      <circle cx="150" cy="110" r="24" fill="none" />
      <line x1="45" y1="45" x2="85" y2="55" />
      <line x1="120" y1="120" x2="180" y2="140" />
    </g>
    <!-- Dark transparent Crystal Reports printing bug alert -->
    <rect x="20" y="70" width="185" height="42" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="1" opacity="0.9" />
    <text x="32" y="88" fill="#fca5a5" font-family="'Fira Code', monospace" font-size="9" font-weight="700">RAW CAD: 4,890 KB</text>
    <text x="32" y="102" fill="#f87171" font-family="'Fira Code', monospace" font-size="8">Crystal Reports Blank Print Bug</text>
  </g>

  <!-- RIGHT PANE: SOLID WHITE PURE VECTOR WMF (24 KB) -->
  <g transform="translate(245, 44)">
    <!-- Solid pure-white background for flawless Crystal Reports embedding -->
    <rect x="0" y="0" width="225" height="186" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="2" />
    <!-- Crisp razor-sharp CAD vector lines -->
    <g stroke="#0f172a" stroke-width="1.2" stroke-linecap="round" fill="none">
      <rect x="30" y="30" width="165" height="120" />
      <line x1="30" y1="70" x2="195" y2="70" />
      <line x1="100" y1="30" x2="100" y2="150" />
      <circle cx="150" cy="110" r="24" />
      <line x1="45" y1="45" x2="85" y2="55" stroke="#0284c7" stroke-width="1.5" />
      <line x1="120" y1="120" x2="180" y2="140" stroke="#0284c7" stroke-width="1.5" />
    </g>
    <!-- Crisp Vector Badge -->
    <rect x="20" y="136" width="185" height="34" rx="4" fill="#047857" opacity="0.95" />
    <text x="30" y="152" fill="#ffffff" font-family="'Fira Code', monospace" font-size="9.5" font-weight="800">WMF VECTOR: 24.2 KB</text>
    <text x="30" y="164" fill="#a7f3d0" font-family="'Fira Code', monospace" font-size="8">100% Vector Lines • Pure White</text>
  </g>

  <!-- Center Split Line Indicator -->
  <line x1="240" y1="44" x2="240" y2="230" stroke="#00f2fe" stroke-width="2" filter="url(#wmf-glow)" />

  <!-- Status Bottom Banner -->
  <g transform="translate(10, 238)">
    <rect x="0" y="0" width="460" height="30" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="12" y="19" fill="#10b981" font-family="'Fira Code', monospace" font-size="10" font-weight="700">✓ SOLID WHITE CANVAS (NO PRINT GLITCHES)</text>
    <text x="315" y="19" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="9.5">&lt;= 25 KB Crystal Reports</text>
  </g>
</svg>