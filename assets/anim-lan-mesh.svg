<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="100%" height="280">
  <defs>
    <linearGradient id="lan-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>
    <linearGradient id="radar-sweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>
    <filter id="radar-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes radarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes blipPulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.3); opacity: 0.4; }
    }
    .sweep-arm { animation: radarSpin 5s linear infinite; transform-origin: 130px 145px; }
    .blip-1 { animation: blipPulse 1.8s infinite; transform-origin: 90px 110px; }
    .blip-2 { animation: blipPulse 1.8s infinite 0.6s; transform-origin: 175px 120px; }
    .blip-3 { animation: blipPulse 1.8s infinite 1.2s; transform-origin: 120px 190px; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="476" height="276" rx="16" fill="url(#lan-bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="2" y="2" width="476" height="36" rx="16" fill="#0b1329" />
  <rect x="2" y="26" width="476" height="12" fill="#0b1329" />
  <circle cx="20" cy="18" r="4.5" fill="#ef4444" />
  <circle cx="34" cy="18" r="4.5" fill="#f59e0b" />
  <circle cx="48" cy="18" r="4.5" fill="#10b981" />
  <text x="70" y="22" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="11" font-weight="600">06 // P2P LAN MESH RADAR</text>
  <rect x="360" y="9" width="104" height="18" rx="9" fill="#064e3b" />
  <text x="372" y="22" fill="#34d399" font-family="'Fira Code', monospace" font-size="9" font-weight="700">● 4 PEERS SYNC</text>

  <!-- RADAR DISPLAY (LEFT) -->
  <g transform="translate(15, 45)">
    <!-- Radar Base Circle -->
    <circle cx="115" cy="100" r="85" fill="#021c16" stroke="#065f46" stroke-width="1.5" />
    <!-- Concentric Range Rings -->
    <circle cx="115" cy="100" r="60" fill="none" stroke="#047857" stroke-width="1" stroke-dasharray="4,4" opacity="0.6" />
    <circle cx="115" cy="100" r="35" fill="none" stroke="#047857" stroke-width="1" stroke-dasharray="4,4" opacity="0.6" />
    <!-- Crosshairs -->
    <line x1="115" y1="15" x2="115" y2="185" stroke="#065f46" stroke-width="1" />
    <line x1="30" y1="100" x2="200" y2="100" stroke="#065f46" stroke-width="1" />

    <!-- Rotating Radar Sweep Cone -->
    <g class="sweep-arm">
      <!-- Sector Cone -->
      <path d="M 115 100 L 200 100 A 85 85 0 0 1 175 160 Z" fill="url(#radar-sweep)" opacity="0.65" />
      <line x1="115" y1="100" x2="200" y2="100" stroke="#34d399" stroke-width="2" filter="url(#radar-glow)" />
    </g>

    <!-- Center Host Radar Node -->
    <circle cx="115" cy="100" r="4.5" fill="#10b981" />

    <!-- Discovered Peer Blips -->
    <g class="blip-1">
      <circle cx="75" cy="65" r="5" fill="#38bdf8" filter="url(#radar-glow)" />
      <text x="45" y="55" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="7.5" font-weight="700">192.168.1.11</text>
    </g>

    <g class="blip-2">
      <circle cx="160" cy="75" r="5" fill="#38bdf8" filter="url(#radar-glow)" />
      <text x="145" y="65" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="7.5" font-weight="700">192.168.1.22</text>
    </g>

    <g class="blip-3">
      <circle cx="105" cy="145" r="5" fill="#10b981" filter="url(#radar-glow)" />
      <text x="80" y="162" fill="#34d399" font-family="'Fira Code', monospace" font-size="7.5" font-weight="700">192.168.1.19 [MASTER]</text>
    </g>
  </g>

  <!-- RIGHT SIDE: PEER TELEMETRY & PROTOCOL STACK -->
  <g transform="translate(240, 50)">
    <!-- Card 1: UDP Broadcast -->
    <rect x="0" y="0" width="220" height="52" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="12" y="20" fill="#64748b" font-family="'Fira Code', monospace" font-size="8.5" font-weight="700">UDP DISCOVERY PORT</text>
    <text x="12" y="38" fill="#34d399" font-family="'Fira Code', monospace" font-size="13" font-weight="800">52822 (BROADCAST)</text>
    <text x="160" y="28" fill="#10b981" font-family="'Fira Code', monospace" font-size="9">● ACTIVE</text>

    <!-- Card 2: TCP High-Speed Stream -->
    <g transform="translate(0, 60)">
      <rect x="0" y="0" width="220" height="52" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="20" fill="#64748b" font-family="'Fira Code', monospace" font-size="8.5" font-weight="700">TCP FILE TRANSFER</text>
      <text x="12" y="38" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="13" font-weight="800">52824 (GIGABIT LAN)</text>
      <text x="155" y="28" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="9">112 MB/s</text>
    </g>

    <!-- Card 3: Security & Elevation -->
    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="220" height="52" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="18" fill="#64748b" font-family="'Fira Code', monospace" font-size="8.5" font-weight="700">ADMIN ELEVATION</text>
      <text x="12" y="36" fill="#f59e0b" font-family="'Fira Code', monospace" font-size="10" font-weight="700">Scheduled Task Elevation</text>
      <text x="12" y="48" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="8">SmartScreen ADS Zone-Bypass</text>
    </g>
  </g>

  <!-- Status Bottom Banner -->
  <g transform="translate(10, 238)">
    <rect x="0" y="0" width="460" height="30" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="12" y="19" fill="#10b981" font-family="'Fira Code', monospace" font-size="10" font-weight="700">✓ AUTO SUBNET MESH LINK ESTABLISHED</text>
    <text x="315" y="19" fill="#34d399" font-family="'Fira Code', monospace" font-size="9.5">Web Share (52826)</text>
  </g>
</svg>