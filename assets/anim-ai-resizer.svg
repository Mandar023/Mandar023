<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="100%" height="280">
  <defs>
    <linearGradient id="ai-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>
    <linearGradient id="ai-laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <filter id="ai-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes scanV {
      0% { transform: translateY(0); opacity: 0.3; }
      50% { transform: translateY(150px); opacity: 1; }
      100% { transform: translateY(0); opacity: 0.3; }
    }
    @keyframes crosshairPulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.06); opacity: 1; }
    }
    .laser-scan { animation: scanV 3.2s ease-in-out infinite; }
    .crosshair-box { animation: crosshairPulse 2s ease-in-out infinite; transform-origin: 120px 135px; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="476" height="276" rx="16" fill="url(#ai-bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="2" y="2" width="476" height="36" rx="16" fill="#0b1329" />
  <rect x="2" y="26" width="476" height="12" fill="#0b1329" />
  <circle cx="20" cy="18" r="4.5" fill="#ef4444" />
  <circle cx="34" cy="18" r="4.5" fill="#f59e0b" />
  <circle cx="48" cy="18" r="4.5" fill="#10b981" />
  <text x="70" y="22" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="11" font-weight="600">05 // OFFLINE AI BIOMETRIC RESIZER</text>
  <rect x="360" y="9" width="104" height="18" rx="9" fill="#3b0764" />
  <text x="370" y="22" fill="#d8b4fe" font-family="'Fira Code', monospace" font-size="9" font-weight="700">● ONNX NEURAL</text>

  <!-- Photo Scanner Frame (Left) -->
  <g transform="translate(20, 50)">
    <!-- Photo Background (White Studio Portrait) -->
    <rect x="0" y="0" width="180" height="175" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
    
    <!-- Stylized Biometric Portrait Silhouette -->
    <!-- Head -->
    <circle cx="90" cy="65" r="32" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Shoulders -->
    <path d="M 35 155 C 45 115, 135 115, 145 155 Z" fill="#94a3b8" />

    <!-- AI Bounding Box (Face Tracking) -->
    <g class="crosshair-box">
      <rect x="52" y="28" width="76" height="76" rx="4" fill="none" stroke="#a855f7" stroke-width="2" stroke-dasharray="8,6" />
      <!-- Target Corner Brackets -->
      <path d="M 46 36 L 46 22 L 60 22" fill="none" stroke="#00f2fe" stroke-width="2.5" />
      <path d="M 134 36 L 134 22 L 120 22" fill="none" stroke="#00f2fe" stroke-width="2.5" />
      <path d="M 46 96 L 46 110 L 60 110" fill="none" stroke="#00f2fe" stroke-width="2.5" />
      <path d="M 134 96 L 134 110 L 120 110" fill="none" stroke="#00f2fe" stroke-width="2.5" />
      <text x="56" y="20" fill="#a855f7" font-family="'Fira Code', monospace" font-size="8" font-weight="700">FACE: 99.4%</text>
    </g>

    <!-- Moving Laser Scanner -->
    <g class="laser-scan">
      <line x1="0" y1="10" x2="180" y2="10" stroke="url(#ai-laser)" stroke-width="3" filter="url(#ai-glow)" />
      <circle cx="90" cy="10" r="4" fill="#00f2fe" filter="url(#ai-glow)" />
    </g>
  </g>

  <!-- Right Side: AI Biometric Telemetry & Constraints -->
  <g transform="translate(220, 50)">
    <!-- Spec Card 1: DPI -->
    <rect x="0" y="0" width="240" height="48" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="12" y="20" fill="#64748b" font-family="'Fira Code', monospace" font-size="8.5" font-weight="700">RESOLUTION TARGET</text>
    <text x="12" y="38" fill="#10b981" font-family="'Fira Code', monospace" font-size="13" font-weight="800">300 DPI STRICT</text>
    <text x="160" y="30" fill="#34d399" font-family="'Fira Code', monospace" font-size="9">✓ LOCKED</text>

    <!-- Spec Card 2: File Size -->
    <g transform="translate(0, 56)">
      <rect x="0" y="0" width="240" height="48" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="20" fill="#64748b" font-family="'Fira Code', monospace" font-size="8.5" font-weight="700">EXAM WEIGHT RANGE</text>
      <text x="12" y="38" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="13" font-weight="800">20 KB - 50 KB</text>
      <text x="160" y="30" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="9">38.4 KB CUR</text>
    </g>

    <!-- Spec Card 3: Neural Model -->
    <g transform="translate(0, 112)">
      <rect x="0" y="0" width="240" height="63" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="12" y="18" fill="#64748b" font-family="'Fira Code', monospace" font-size="8.5" font-weight="700">NEURAL BACKEND</text>
      <text x="12" y="35" fill="#c084fc" font-family="'Fira Code', monospace" font-size="11" font-weight="700">U2Net ONNX Embedded</text>
      <text x="12" y="52" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="8.5">100% Offline • Zero Cloud Leak</text>
    </g>
  </g>

  <!-- Status Bottom Banner -->
  <g transform="translate(10, 238)">
    <rect x="0" y="0" width="460" height="30" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="12" y="19" fill="#10b981" font-family="'Fira Code', monospace" font-size="10" font-weight="700">✓ BIOMETRIC SPEC VERIFIED (MPSC / UPSC / GOVT)</text>
    <text x="325" y="19" fill="#a855f7" font-family="'Fira Code', monospace" font-size="9.5">Auto Background Strip</text>
  </g>
</svg>