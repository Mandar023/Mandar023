<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="260">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060E" />
      <stop offset="50%" stop-color="#080E21" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Glowing Cyan/Purple Line Gradients -->
    <linearGradient id="cyber-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="30%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#7000FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF007A" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#818CF8" />
      <stop offset="80%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>

    <linearGradient id="core-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 3D Grid Perspective Mask -->
    <linearGradient id="grid-fade" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.7" />
      <stop offset="60%" stop-color="#fff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <mask id="grid-mask">
      <rect x="0" y="100" width="900" height="160" fill="url(#grid-fade)" />
    </mask>

    <style>
      @keyframes grid-drift {
        0% { transform: translateY(0px); }
        100% { transform: translateY(24px); }
      }
      @keyframes pulse-ring {
        0% { transform: scale(0.95); opacity: 0.6; }
        50% { transform: scale(1.08); opacity: 1; }
        100% { transform: scale(0.95); opacity: 0.6; }
      }
      @keyframes float-cube {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(3deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes beam-sweep {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      @keyframes text-shimmer {
        0% { filter: hue-rotate(0deg); }
        50% { filter: hue-rotate(25deg); }
        100% { filter: hue-rotate(0deg); }
      }
      .anim-grid {
        animation: grid-drift 2.2s linear infinite;
      }
      .anim-ring {
        transform-origin: 760px 125px;
        animation: pulse-ring 3.5s ease-in-out infinite;
      }
      .anim-cube {
        transform-origin: 760px 125px;
        animation: float-cube 4.5s ease-in-out infinite;
      }
      .anim-shimmer {
        animation: text-shimmer 6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Card Background with 3D Bevel -->
  <rect x="2" y="2" width="896" height="256" rx="16" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="1.5" />
  
  <!-- Sleek Top Edge Highlight -->
  <line x1="20" y1="2" x2="880" y2="2" stroke="url(#cyber-cyan)" stroke-width="2" filter="url(#subtle-glow)" />

  <!-- 3D Perspective Grid Background (Bottom) -->
  <g mask="url(#grid-mask)">
    <g class="anim-grid" stroke="#0EA5E9" stroke-width="0.8" opacity="0.6">
      <!-- Horizontal Perspective Lines -->
      <line x1="0" y1="120" x2="900" y2="120" />
      <line x1="0" y1="140" x2="900" y2="140" />
      <line x1="0" y1="164" x2="900" y2="164" />
      <line x1="0" y1="192" x2="900" y2="192" />
      <line x1="0" y1="224" x2="900" y2="224" />
      <line x1="0" y1="260" x2="900" y2="260" />

      <!-- Vertical Perspective Fan Rays -->
      <line x1="450" y1="100" x2="-200" y2="260" />
      <line x1="450" y1="100" x2="50" y2="260" />
      <line x1="450" y1="100" x2="200" y2="260" />
      <line x1="450" y1="100" x2="320" y2="260" />
      <line x1="450" y1="100" x2="400" y2="260" />
      <line x1="450" y1="100" x2="450" y2="260" />
      <line x1="450" y1="100" x2="500" y2="260" />
      <line x1="450" y1="100" x2="580" y2="260" />
      <line x1="450" y1="100" x2="700" y2="260" />
      <line x1="450" y1="100" x2="850" y2="260" />
      <line x1="450" y1="100" x2="1100" y2="260" />
    </g>
  </g>

  <!-- Left Content: Identity & Futuristic Typography -->
  <g transform="translate(48, 50)">
    <!-- Terminal Header Pill -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="26" rx="6" fill="#0C1527" stroke="#0284C7" stroke-width="1" />
      <circle cx="14" cy="13" r="4.5" fill="#10B981" filter="url(#subtle-glow)" />
      <text x="26" y="17" fill="#38BDF8" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">SYSTEMS // ONLINE</text>
    </g>

    <!-- Main Title with Gradient Shimmer -->
    <g class="anim-shimmer" transform="translate(0, 58)">
      <text x="0" y="0" fill="url(#text-grad)" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="3.5" filter="url(#subtle-glow)">MANDAR</text>
      <text x="210" y="0" fill="#94A3B8" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="14" font-weight="400" letter-spacing="2">/ 023</text>
    </g>

    <!-- Subtitle: Professional Role -->
    <text x="2" y="88" fill="#F8FAFC" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="1.2">ENTERPRISE SYSTEMS ARCHITECT &amp; SOFTWARE ENGINEER</text>

    <!-- Technical Focus Badges -->
    <g transform="translate(2, 110)">
      <text x="0" y="12" fill="#94A3B8" font-family="'Fira Code', Consolas, monospace" font-size="12" letter-spacing="0.5">High-Throughput Windows Automation • SQL Infrastructure • Zero-Dependency Tooling</text>
    </g>
  </g>

  <!-- Right Visual: 3D Holographic Cyber Core -->
  <g class="anim-cube">
    <!-- Ambient Hologram Glow Aura -->
    <circle cx="760" cy="125" r="75" fill="#0284C7" opacity="0.12" filter="url(#neon-glow)" />

    <!-- 3D Isometric Core Prism -->
    <g transform="translate(760, 125)">
      <!-- Outer Hex Shield -->
      <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="#050B19" stroke="#00F0FF" stroke-width="1.8" filter="url(#subtle-glow)" opacity="0.9" />

      <!-- Isometric Top Face -->
      <polygon points="0,-52 45,-26 0,0 -45,-26" fill="#0284C7" opacity="0.65" />
      
      <!-- Isometric Left Face -->
      <polygon points="-45,-26 0,0 0,52 -45,26" fill="#082F49" opacity="0.85" />
      
      <!-- Isometric Right Face -->
      <polygon points="0,0 45,-26 45,26 0,52" fill="#0C4A6E" opacity="0.75" />

      <!-- Inner Neon Nexus Diamond Core -->
      <polygon points="0,-24 20,-12 20,12 0,24 -20,12 -20,-12" fill="url(#core-glow)" filter="url(#subtle-glow)" opacity="0.95" />
      
      <!-- Floating Energy Rings -->
      <ellipse cx="0" cy="0" rx="64" ry="24" fill="none" stroke="#7000FF" stroke-width="1.2" opacity="0.7" transform="rotate(-25)" />
      <ellipse cx="0" cy="0" rx="72" ry="26" fill="none" stroke="#00F0FF" stroke-width="1.5" opacity="0.8" transform="rotate(35)" />
    </g>
  </g>
</svg>
