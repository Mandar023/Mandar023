      <text x="210" y="17" fill="#10b981" font-family="'Fira Code', monospace" font-size="8.5" font-weight="700">â‚¹18,220</text>
      <text x="275" y="17" fill="#34d399" font-family="'Fira Code', monospace" font-size="8" font-weight="700">âœ“ OK</text>
    </g>

    <g transform="translate(0, 88)" class="grid-row-3">
      <rect x="0" y="0" width="332" height="26" fill="#0f172a" opacity="0.6" />
      <text x="10" y="17" fill="#64748b" font-family="'Fira Code', monospace" font-size="8.5">3</text>
      <text x="42" y="17" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="8.5" font-weight="700">1002483</text>
      <text x="110" y="17" fill="#cbd5e1" font-family="'Fira Code', monospace" font-size="8.5">SYS-NODE-A03</text>
      <text x="210" y="17" fill="#10b981" font-family="'Fira Code', monospace" font-size="8.5" font-weight="700">â‚¹9,410</text>
      <text x="275" y="17" fill="#34d399" font-family="'Fira Code', monospace" font-size="8" font-weight="700">âœ“ OK</text>
    </g>

    <g transform="translate(0, 118)" class="grid-row-4">
      <rect x="0" y="0" width="332" height="26" fill="#0f172a" opacity="0.4" />
      <text x="10" y="17" fill="#64748b" font-family="'Fira Code', monospace" font-size="8.5">4</text>
      <text x="42" y="17" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="8.5" font-weight="700">1002484</text>
      <text x="110" y="17" fill="#cbd5e1" font-family="'Fira Code', monospace" font-size="8.5">SYS-NODE-B01</text>
      <text x="210" y="17" fill="#10b981" font-family="'Fira Code', monospace" font-size="8.5" font-weight="700">â‚¹24,600</text>
      <text x="275" y="17" fill="#34d399" font-family="'Fira Code', monospace" font-size="8" font-weight="700">âœ“ OK</text>
    </g>
  </g>
</svg>
