    <text x="275" y="16" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="8.5" font-weight="700">STATUS</text>

    <!-- Animated Data Rows -->
    <g transform="translate(0, 28)" class="grid-row-1">
      <rect x="0" y="0" width="332" height="26" fill="#0f172a" opacity="0.6" />
      <text x="10" y="17" fill="#64748b" font-family="'Fira Code', monospace" font-size="8.5">1</text>
      <text x="42" y="17" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="8.5" font-weight="700">1002481</text>
      <text x="110" y="17" fill="#cbd5e1" font-family="'Fira Code', monospace" font-size="8.5">SYS-NODE-A01</text>
      <text x="210" y="17" fill="#10b981" font-family="'Fira Code', monospace" font-size="8.5" font-weight="700">â‚¹14,850</text>
      <text x="275" y="17" fill="#34d399" font-family="'Fira Code', monospace" font-size="8" font-weight="700">âœ“ OK</text>
    </g>

    <g transform="translate(0, 58)" class="grid-row-2">
      <rect x="0" y="0" width="332" height="26" fill="#0f172a" opacity="0.4" />
      <text x="10" y="17" fill="#64748b" font-family="'Fira Code', monospace" font-size="8.5">2</text>
