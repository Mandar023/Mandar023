<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="100%" height="280">
  <defs>
    <linearGradient id="sql-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>
    <filter id="sql-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes rowSlide {
      0% { transform: translateY(-10px); opacity: 0; }
      15% { transform: translateY(0); opacity: 1; }
      85% { opacity: 1; }
      100% { opacity: 0.8; }
    }
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .grid-row-1 { animation: rowSlide 3s ease-out infinite; }
    .grid-row-2 { animation: rowSlide 3s ease-out infinite 0.6s; }
    .grid-row-3 { animation: rowSlide 3s ease-out infinite 1.2s; }
    .grid-row-4 { animation: rowSlide 3s ease-out infinite 1.8s; }
    .sql-cursor { animation: cursorBlink 0.8s infinite; }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="476" height="276" rx="16" fill="url(#sql-bg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Window Header -->
  <rect x="2" y="2" width="476" height="36" rx="16" fill="#0b1329" />
  <rect x="2" y="26" width="476" height="12" fill="#0b1329" />
  <circle cx="20" cy="18" r="4.5" fill="#ef4444" />
  <circle cx="34" cy="18" r="4.5" fill="#f59e0b" />
  <circle cx="48" cy="18" r="4.5" fill="#10b981" />
  <text x="70" y="22" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="11" font-weight="600">03 // SSMS SQL CONSOLE (TIMEOUT: 0)</text>
  <rect x="360" y="9" width="104" height="18" rx="9" fill="#042f2e" />
  <text x="372" y="22" fill="#2dd4bf" font-family="'Fira Code', monospace" font-size="9" font-weight="700">â— BATCH RUNNING</text>

  <!-- Object Explorer Sidebar -->
  <g transform="translate(10, 44)">
    <rect x="0" y="0" width="120" height="224" rx="6" fill="#030712" stroke="#1e293b" stroke-width="1" />
    <text x="8" y="18" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="9" font-weight="700">DATABASES</text>
    <text x="14" y="36" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="8.5">â–¾ NexusEnterpriseDB</text>
    <text x="22" y="52" fill="#64748b" font-family="'Fira Code', monospace" font-size="8">â–¸ Tables (142)</text>
    <text x="22" y="68" fill="#64748b" font-family="'Fira Code', monospace" font-size="8">â–¸ Views (28)</text>
    <text x="22" y="84" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="8.5">â–¾ Stored Procs</text>
    <text x="28" y="100" fill="#2dd4bf" font-family="'Fira Code', monospace" font-size="8">â€¢ prcBatchProcess</text>
    <text x="28" y="114" fill="#64748b" font-family="'Fira Code', monospace" font-size="8">â€¢ prcReCalcClusterNode</text>

    <!-- Execution Stats Box -->
    <g transform="translate(6, 140)">
      <rect x="0" y="0" width="108" height="74" rx="4" fill="#0b1329" stroke="#1e3a5f" stroke-width="1" />
      <text x="8" y="16" fill="#64748b" font-family="'Fira Code', monospace" font-size="8" font-weight="700">TIMEOUT</text>
      <text x="8" y="30" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="11" font-weight="800">0 SEC (INF)</text>
      <text x="8" y="48" fill="#64748b" font-family="'Fira Code', monospace" font-size="8" font-weight="700">ROLLBACK</text>
      <text x="8" y="62" fill="#10b981" font-family="'Fira Code', monospace" font-size="10" font-weight="800">SAFE MODE</text>
    </g>
  </g>

  <!-- Query Editor Pane (Top Right) -->
