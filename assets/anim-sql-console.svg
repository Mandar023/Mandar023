    <text x="12" y="22" fill="#a855f7" font-family="'Fira Code', monospace" font-size="9.5" font-weight="700">EXEC</text>
    <text x="44" y="22" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="9.5">[prcExecuteBatchAggregation]</text>
    <text x="12" y="42" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="9.5">@Year=2026, @OwnerID=1002481, @Commit=1</text>
    <!-- Blinking Cursor -->
    <rect x="300" y="32" width="2" height="12" fill="#00f2fe" class="sql-cursor" />
  </g>

